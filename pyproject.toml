[project]
name = "api-consultas-medicas"
version = "0.1.0"
description = ""
authors = [
    {name = "Natalia Maitê",email = "nmaite0@gmail.com"}
]

requires-python = ">=3.13,<4.0"
dependencies = [
    "django (>=6.1.1,<7.0.0)",
    "djangorestframework (>=3.18.1,<4.0.0)",
    "psycopg[binary] (>=3.3.5,<4.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "django-environ (>=0.14.0,<0.15.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.7,<0.17.0)"
]
[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
    "**/migrations/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]